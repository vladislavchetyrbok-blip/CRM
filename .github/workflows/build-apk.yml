name: Build TapMemory APK
on:
  push:
    branches: [ "tooling/tapmemory-apk" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Build
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TapMemory-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TapMemory.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TapMemory.apk
          git commit -m 'Publish TapMemory APK' || true
          git push origin HEAD:tooling/tapmemory-apk
