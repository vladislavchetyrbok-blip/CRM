plugins { id 'com.android.application' }
android {
  namespace 'com.tapmemory.app'
  compileSdk 35
  defaultConfig {
    applicationId 'com.tapmemory.app.v22'
    minSdk 26
    targetSdk 32
    versionCode 22
    versionName '2.2'
  }
  buildTypes { release { minifyEnabled false } }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}